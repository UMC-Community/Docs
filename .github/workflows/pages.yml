name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v6
      - name: Checkout UMC API contracts
        uses: actions/checkout@v6
        with:
          repository: UMC-Community/UMC
          path: umc-source
      - name: Checkout UMC-Auth API contract
        uses: actions/checkout@v6
        with:
          repository: UMC-Community/UMC-Auth
          path: umc-auth-source
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install documentation dependencies
        run: npm ci
      - name: Build documentation
        env:
          UMC_SOURCE_DIR: ${{ github.workspace }}/umc-source
          UMC_AUTH_SOURCE_DIR: ${{ github.workspace }}/umc-auth-source
        run: npm run docs:build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
